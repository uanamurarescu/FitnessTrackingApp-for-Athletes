<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fitness Tracking App</title>
    <link rel="stylesheet" href="styles/style.css" />
</head>
<body>
    <header class="app-header">
        <div class="header-top">
            <div>
                <h1>Hi, Jane Doe.</h1>
                <p>December 30, Tuesday</p>
            </div>
            <span class="menu-icon">☰</span>
        </div>
    </header>

    <main class="container">
        <section class="metrics-grid">
            <div class="metric-card">
                <div class="metric-icon">🏃‍♂️</div>
                <div class="metric-value">7,268</div>
                <div class="metric-label">Steps</div>
            </div>
            <div class="metric-card">
                <div class="metric-icon">❤️</div>
                <div class="metric-value">4,115 <span class="unit">kcal</span></div>
                <div class="metric-label">Cal Burn</div>
            </div>
            <div class="metric-card">
                <div class="metric-icon">🔥</div>
                <div class="metric-value">98 <span class="unit">BPM</span></div>
                <div class="metric-label">Heartbeat</div>
            </div>
        </section>

        <section class="panel calories-panel">
            <div class="panel-header-row">
                <h2>CALORIES</h2>
                <span class="sub-text">Weekly Average<br><strong>112 CAL</strong></span>
            </div>
            <div class="chart-bars">
                <div class="bar-col"><span></span><label>SUN</label></div>
                <div class="bar-col"><span></span><label>MON</label></div>
                <div class="bar-col active"><span></span><label>TUE</label></div>
                <div class="bar-col"><span></span><label>WED</label></div>
                <div class="bar-col"><span></span><label>THURS</label></div>
                <div class="bar-col"><span></span><label>FRI</label></div>
                <div class="bar-col"><span></span><label>SAT</label></div>
            </div>
        </section>

        <section class="panel plan-panel">
            <div class="panel-header-row">
                <h2>Log Your Workouts</h2>
                <a href="#" class="view-all"> &gt;</a>
            </div>
            <div class="workout-banner-card">
                <div class="workout-info">
                    <h3>Back Workout</h3>
                    <p>MONDAY</p>
                </div>
            </div>
        </section>
    </main>

    <script src="exercises.js"></script>
</body>
</html>
